name: Exact-source regression validation
on:
  push:
    branches:
      - 'validation/independent-keisler-stats-20260928'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11']
    env:
      TF_CPP_MIN_LOG_LEVEL: '3'
      TF_NUM_INTEROP_THREADS: '1'
      TF_NUM_INTRAOP_THREADS: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      JAX_PLATFORMS: cpu
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: sylvesterkaczmarek/spherical-cnn
          ref: 'a7e11d8ddb6f7ac63609af19fd8f11bf18de889f'
          path: work
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Install focused test dependencies
        run: python -m pip install pytest==9.1.1 pytest-cov ruff pyink tensorflow==2.20.0 numpy==1.26.4 pandas==2.2.3 grain==0.2.3 jax==0.4.38 jaxlib==0.4.38 ml-dtypes==0.5.4 tensorflow-datasets==4.9.10 ml-collections immutabledict xarray
      - name: Verify exact source and original-code controls
        run: python validation/verify.py work evidence
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: evidence-${{ matrix.python }}
          path: evidence
          retention-days: 14
